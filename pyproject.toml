[project]
name = "media-gen"
version = "0.1.0"
description = "Local image and video generation service for Apple Silicon, with OpenAI-compatible endpoints"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pillow>=11.0",
    "psutil>=7.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# The generation engines. Pinned exactly: both change quickly and the curated
# manifests are tested against these versions.
engines = [
    "mflux==0.24.0",
    "mlx-video-with-audio==0.1.37",
]

[project.scripts]
media-gen = "media_gen.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_gen"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
