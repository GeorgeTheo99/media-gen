[project]
name = "media-gen"
version = "0.6.0"
description = "Local image and video generation service for Apple Silicon, with OpenAI-compatible endpoints"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pillow>=11.0",
    "psutil>=7.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# The generation engines. Pinned exactly: both change quickly and the curated
# manifests are tested against these versions.
engines = [
    "mflux==0.24.0",
    "ltx-core-mlx==0.18.0",
    "ltx-pipelines-mlx==0.18.0",
    "mlx-video",
    # The Wan engine imports mlx-vlm even for video-only use. Keep its API pinned.
    "mlx-vlm==0.4.0",
]

[project.scripts]
media-gen = "media_gen.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_gen"]

[tool.uv.sources]
# The PyPI mlx-video name is a different project; always use this exact source.
mlx-video = { git = "https://github.com/Blaizzy/mlx-video", rev = "87db56a51758fefb748a359b90a5283bb8ba4837" }
# ltx-2-mlx v0.18.0 is not on PyPI: pinned by commit, since a tag can move.
ltx-core-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx", subdirectory = "packages/ltx-core-mlx", rev = "b82b97e3d000e01361f8cfcb745244b15b89a521" }
ltx-pipelines-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx", subdirectory = "packages/ltx-pipelines-mlx", rev = "b82b97e3d000e01361f8cfcb745244b15b89a521" }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
